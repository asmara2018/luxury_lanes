<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Luxury Lanes</title>
    <link rel="stylesheet" href="CSS Luxury Lanes.css">
    <script src="nav.js"></script>
</head>
<body>

<aside class="nav-panel">
    <h2>Luxury Lanes</h2>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-bottom">
        <a href="Login.html" onclick="logout()">Log Out</a>
    </div>
</aside>

<main class="content-area">

    <div class="page-header">
        <div>
            <h1>Dashboard</h1>
            <p>Welcome back, <span id="welcomeName"></span></p>
        </div>
    </div>

    <section class="request-summary">
        <div class="summary-tile">
            <p>Total Requests</p>
            <h2 id="totalCount">-</h2>
        </div>
        <div class="summary-tile tile-urgent">
            <p>High Priority</p>
            <h2 id="highCount">-</h2>
        </div>
        <div class="summary-tile tile-active">
            <p>In Progress</p>
            <h2 id="inProgressCount">-</h2>
        </div>
        <div class="summary-tile tile-resolved">
            <p>Completed</p>
            <h2 id="completedCount">-</h2>
        </div>
    </section>

    <div class="fault-log">
        <h3>Recent Maintenance Requests</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Room</th>
                    <th>Title</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="requestTable">
                <tr><td colspan="6">Loading...</td></tr>
            </tbody>
        </table>
    </div>

</main>

<script>
var serverAddress = 'http://127.0.0.1:5000';
var currentUserId = localStorage.getItem('user_id');
var currentRole   = localStorage.getItem('role');
var currentName   = localStorage.getItem('name') || '';

// redirect to login if not authenticated
if (!currentUserId) {
    window.location.href = 'Login.html';
}

document.getElementById('welcomeName').textContent = currentName;

// build the sidebar links based on the user's role
function buildNav() {
        // nav.js provides the master link list
        buildNavFromJS('Dashboard.html');
    }

buildNav();

function logout() {
    fetch(serverAddress + '/logout', { method: 'POST', credentials: 'include' });
    localStorage.clear();
}

function loadDashboard() {
    fetch(serverAddress + '/requests?user_id=' + currentUserId, { credentials: 'include' })
    .then(function(response) { return response.json(); })
    .then(function(requests) {

        if (!Array.isArray(requests)) {
            document.getElementById('requestTable').innerHTML =
                '<tr><td colspan="6">Could not load requests. Please log in again.</td></tr>';
            return;
        }

        var totalCount      = requests.length;
        var highCount       = 0;
        var inProgressCount = 0;
        var completedCount  = 0;

        for (var i = 0; i < requests.length; i++) {
            if (requests[i].priority === 'High')      highCount++;
            if (requests[i].status === 'In Progress') inProgressCount++;
            if (requests[i].status === 'Completed')   completedCount++;
        }

        document.getElementById('totalCount').textContent      = totalCount;
        document.getElementById('highCount').textContent       = highCount;
        document.getElementById('inProgressCount').textContent = inProgressCount;
        document.getElementById('completedCount').textContent  = completedCount;

        var rows = '';
        // show most recent 20
        var display = requests.slice(0, 20);

        for (var i = 0; i < display.length; i++) {
            var r    = display[i];
            var date = r.report_time ? r.report_time.split(' ')[0] : '-';
            rows += '<tr>';
            rows += '<td>#' + r.id + '</td>';
            rows += '<td>Room ' + r.room + '</td>';
            rows += '<td>' + r.title + '</td>';
            rows += '<td>' + r.priority + '</td>';
            rows += '<td>' + r.status + '</td>';
            rows += '<td>' + date + '</td>';
            rows += '</tr>';
        }

        if (rows === '') {
            rows = '<tr><td colspan="6">No requests yet.</td></tr>';
        }

        document.getElementById('requestTable').innerHTML = rows;
    })
    .catch(function() {
        document.getElementById('requestTable').innerHTML =
            '<tr><td colspan="6">Cannot connect to server. Is Server.py running?</td></tr>';
    });
}

loadDashboard();
</script>

</body>
</html>
