<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Luxury Lanes</title>
    <link rel="stylesheet" href="CSS Luxury Lanes.css">
    <script src="nav.js"></script>
</head>
<body>

<aside class="nav-panel">
    <h2>Luxury Lanes</h2>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-bottom">
        <a href="Login.html" onclick="logout()">Log Out</a>
    </div>
</aside>

<main class="content-area">

    <div class="page-header">
        <div>
            <h1>Dashboard</h1>
            <p>Overview of all maintenance requests</p>
        </div>
    </div>

    <section class="request-summary">
        <div class="summary-tile">
            <p>Total Requests</p>
            <h2 id="totalCount">-</h2>
        </div>
        <div class="summary-tile tile-urgent">
            <p>High Priority</p>
            <h2 id="highCount">-</h2>
        </div>
        <div class="summary-tile tile-active">
            <p>In Progress</p>
            <h2 id="inProgressCount">-</h2>
        </div>
        <div class="summary-tile tile-resolved">
            <p>Completed</p>
            <h2 id="completedCount">-</h2>
        </div>
    </section>

    <div class="fault-log">
        <h3>Recent Maintenance Requests</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Room</th>
                    <th>Title</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="requestTable">
                <tr><td colspan="6">Loading...</td></tr>
            </tbody>
        </table>
    </div>

</main>

<script>
var serverAddress = 'http://127.0.0.1:5000';
var currentUserId = localStorage.getItem('user_id');

// redirect if not logged in
if (!currentUserId) {
    window.location.href = 'Login.html';
}

// build navigation
function buildNav() {
    buildNavFromJS('Dashboard.html');
}
buildNav();

// logout
function logout() {
    fetch(serverAddress + '/logout', { method: 'POST', credentials: 'include' });
    localStorage.clear();
}

// update dashboard counts
function setAllCounts(total, high, inProgress, completed) {
    document.getElementById('totalCount').textContent = total;
    document.getElementById('highCount').textContent = high;
    document.getElementById('inProgressCount').textContent = inProgress;
    document.getElementById('completedCount').textContent = completed;
}

// main function
function loadDashboard() {
    fetch(serverAddress + '/requests?user_id=' + currentUserId, { credentials: 'include' })
    .then(function(response) {
        return response.json();
    })
    .then(function(requests) {

        console.log("DEBUG DATA:", requests);

        // type check
        if (!Array.isArray(requests)) {
            document.getElementById('requestTable').innerHTML =
                '<tr><td colspan="6">Error loading data</td></tr>';
            setAllCounts(0, 0, 0, 0);
            return;
        }

        var totalCount = requests.length;
        var highCount = 0;
        var inProgressCount = 0;
        var completedCount = 0;

        for (var i = 0; i < requests.length; i++) {
            var p = requests[i].priority;
            var s = requests[i].status;

            if (p && p.toLowerCase() === 'high') highCount++;
            if (s && s.toLowerCase() === 'in progress') inProgressCount++;
            if (s && s.toLowerCase() === 'completed') completedCount++;
        }

        setAllCounts(totalCount, highCount, inProgressCount, completedCount);

        // show only latest 10
        var display = requests.slice(0, 10);
        var rows = '';

        for (var i = 0; i < display.length; i++) {
            var r = display[i];
            var date = r.report_time ? r.report_time.split(' ')[0] : '-';

            rows += '<tr>';
            rows += '<td>#' + (r.id || '-') + '</td>';
            rows += '<td>Room ' + (r.room || '-') + '</td>';
            rows += '<td>' + (r.title || '-') + '</td>';
            rows += '<td>' + (r.priority || '-') + '</td>';
            rows += '<td>' + (r.status || '-') + '</td>';
            rows += '<td>' + date + '</td>';
            rows += '</tr>';
        }

        if (rows === '') {
            rows = '<tr><td colspan="6">No requests yet.</td></tr>';
        }

        document.getElementById('requestTable').innerHTML = rows;
    })
    .catch(function(error) {
        console.error("Fetch error:", error);

        document.getElementById('requestTable').innerHTML =
            '<tr><td> Cannot connect to server </td></tr>';

        setAllCounts(0, 0, 0, 0);
    });
}

// run dashboard
loadDashboard();
</script>

</body>
</html>
