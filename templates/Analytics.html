<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Luxury Lanes</title>
    <link rel="stylesheet" href="CSS Luxury Lanes.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<aside class="nav-panel">
    <h2>Luxury Lanes</h2>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-bottom">
        <a href="Login.html" onclick="logout()">Log Out</a>
    </div>
</aside>

<main class="content-area">

    <div class="page-header">
        <h1>Performance Analytics</h1>
    </div>
<p>Live overview of all the maintenance activity</p>

    <!-- KPI tile section added in iteration 3 - modelled on dashboard summary tiles -->
    <!-- metric-grid gives four equal columns so all four tiles sit in a single row -->
    <div class="metric-grid">
        <!-- Each tile has three parts: metric-label, metric-value (with unique id for JS), metric-unit -->
        <div class="metric-tile">
            <p class="metric-label">Avg Completion Time</p>
            <p class="metric-value" id="kpiAvgTime">-</p>
            <p class="metric-unit">hours</p>
        </div>
        <div class="metric-tile">
            <p class="metric-label">On-Time Rate</p>
            <!-- id given so JS can update this tile individually without affecting others -->
            <p class="metric-value" id="kpiOnTime">-</p>
            <p class="metric-unit">of requests</p>
        </div>
        <div class="metric-tile">
            <p class="metric-label">Avg Guest Rating</p>
            <!-- id given so JS can update this tile individually without affecting others -->
            <p class="metric-value" id="kpiRating">-</p>
            <p class="metric-unit">out of 5</p>
        </div>
        <div class="metric-tile">
            <p class="metric-label">Performance Index</p>
            <!-- id given so JS can update this tile individually without affecting others -->
            <p class="metric-value" id="kpiIndex">-</p>
            <p class="metric-unit">overall score</p>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Metric</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody id="analyticsTable">
        </tbody>
    </table>
<p>Request Status Overview</p>
    <!-- sets a fixed height and width container for the chart -->
    <div style="width:300px; height:250px; margin-top:24px;">
        <!-- id given to statusChart so I can target it specifically using getElementById -->
        <canvas id="statusChart"></canvas>
        <!-- message displayed to explain what the pie chart is needed for -->
    </div>

    <!-- Priority bar chart added in iteration 3 -->
    <!-- bar chart chosen over another doughnut as it makes it easier to compare categories -->
    <!-- a manager can instantly see if high priority jobs are dominating -->
    <p>Priority Breakdown</p>
    <div style="width:350px; height:270px; margin-top:24px;">
        <!-- id given to priorityChart so JS can target it specifically using getElementById -->
        <canvas id="priorityChart"></canvas>
    </div>

</main>

<script>
    var serverAddress = 'http://127.0.0.1:5000';
    var currentUserId = localStorage.getItem('user_id');
    var currentRole   = localStorage.getItem('role');

    if (!currentUserId) { window.location.href = 'Login.html'; }
    if (currentRole !== 'Manager') { window.location.href = 'Dashboard.html'; }

    var nav = document.getElementById('navLinks');
    nav.innerHTML += "<a href='Dashboard.html'>Dashboard</a>";
    nav.innerHTML += "<a href='ReportFault.html'>Report Fault</a>";
    nav.innerHTML += "<a href='AssignJob.html'>Assign Jobs</a>";
    nav.innerHTML += "<a href='Analytics.html' class='current'>Analytics</a>";
    nav.innerHTML += "<a href='Notifications.html'>Notifications</a>";
    nav.innerHTML += "<a href='Feedback.html'>Feedback</a>";

    function loadAnalytics() {
        fetch(serverAddress + '/analytics?user_id=' + currentUserId)
        .then(function(response) { return response.json(); })
        .then(function(data) {
            var tbody = document.getElementById('analyticsTable');
            tbody.innerHTML = '';

            var tr1 = document.createElement('tr');
            tr1.innerHTML = '<td>Average Completion Time</td><td>' + (data.average_time || '-') + '</td>';
            tbody.appendChild(tr1);

            var tr2 = document.createElement('tr');
            tr2.innerHTML = '<td>Median Completion Time</td><td>' + (data.median_time || '-') + '</td>';
            tbody.appendChild(tr2);

            var tr3 = document.createElement('tr');
            tr3.innerHTML = '<td>On-Time Rate</td><td>' + (data.on_time_rate || '-') + '</td>';
            tbody.appendChild(tr3);

            var tr4 = document.createElement('tr');
            tr4.innerHTML = '<td>Repeat Issue Rate</td><td>' + (data.repeat_rate || '-') + '</td>';
            tbody.appendChild(tr4);

            var tr5 = document.createElement('tr');
            tr5.innerHTML = '<td>SLA Breach Count</td><td>' + (data.sla_breaches || '-') + '</td>';
            tbody.appendChild(tr5);

            var tr6 = document.createElement('tr');
            tr6.innerHTML = '<td>Escalation Rate</td><td>' + (data.escalation_rate || '-') + '</td>';
            tbody.appendChild(tr6);

            var tr7 = document.createElement('tr');
            tr7.innerHTML = '<td>Data Quality Score</td><td>' + (data.data_quality || '-') + '</td>';
            tbody.appendChild(tr7);

            // Performance Index row added in iteration 3 - calculated in JS not Flask
            // total, completed and rating use || 0 so calculation receives a number even if Flask returns null
            var total = data.reported + data.in_progress + data.completed || 0;
            var completed = data.completed || 0;
            var rating = data.avg_rating || 0;
            // total > 0 prevents division by zero when no requests exist in the database
            var perfIndex = '-';
            if (total > 0) {
                // completion rate weighted at 60% - getting jobs resolved is the most important measure
                // average rating weighted at 40% - guest satisfaction matters but should not produce zero if no feedback submitted
                // rating divided by 5 to make it between 0 and 1 before converting to percentage
                // Math.round produces a whole number percentage so no decimal places difficult to read for a manager
                var completionRate = completed / total;
                var ratingNorm = rating / 5;
                perfIndex = Math.round((completionRate * 0.6 + ratingNorm * 0.4) * 100) + '%';
            }
            var tr8 = document.createElement('tr');
            tr8.innerHTML = '<td>Performance Index</td><td>' + perfIndex + '</td>';
            tbody.appendChild(tr8);

            // pie chart added to give managers a visual breakdown of request status
            var canvas = document.getElementById('statusChart').getContext('2d');
            new Chart(canvas, {
                type: 'pie',
                data: {
                    labels: ['Reported', 'In Progress', 'Completed'],
                    datasets: [{
                        data: [data.reported, data.in_progress, data.completed],
                        backgroundColor: ['#6366f2', '#f59e0b', '#16a34a']
                    }]
                },
                options: {
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });

            // KPI tiles populated in iteration 3
            // null check used over truth check because some values could be 0
            // a truth check would treat 0 as false and show a dash incorrectly
            // separate getElementById calls used rather than a loop because each tile has a different format and unit
            document.getElementById('kpiAvgTime').textContent = data.average_time !== null && data.average_time !== undefined ? data.average_time : '-';
            // percentage symbol added in JS not in Flask response so the value stays numeric in JSON for further calculation
            document.getElementById('kpiOnTime').textContent = data.on_time_rate !== null && data.on_time_rate !== undefined ? data.on_time_rate + '%' : '-';
            // average guest rating retrieved from feedback table - displays dash if no feedback forms submitted
            document.getElementById('kpiRating').textContent = data.avg_rating !== null && data.avg_rating !== undefined ? data.avg_rating : '-';
            document.getElementById('kpiIndex').textContent = perfIndex;

            // priority bar chart added in iteration 3
            // bar chart chosen because it makes it easier to compare categories than another doughnut
            // height of each bar represents quantity so a manager can instantly see if high priority jobs are dominating
            var priorityCanvas = document.getElementById('priorityChart').getContext('2d');
            new Chart(priorityCanvas, {
                type: 'bar',
                data: {
                    labels: ['High', 'Medium', 'Low'],
                    datasets: [{
                        label: 'Requests by Priority',
                        // bar colours match the priority tag colours used on every page of my system
                        // allows a manager to be familiar with priority colours from view requests
                        data: [data.high_priority || 0, data.medium_priority || 0, data.low_priority || 0],
                        backgroundColor: ['#ef4444', '#f59e0b', '#16a34a']
                    }]
                },
                options: {
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: {
                                // x axis grid lines hidden using display false so no background lines behind the bars
                                display: false
                            }
                        },
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        })
        .catch(function() {
            alert('Analytics has not loaded check if server.py is running');
        });
    }

    loadAnalytics();

    function logout() {
        localStorage.removeItem('user_id');
        localStorage.removeItem('role');
        localStorage.removeItem('name');
    }
</script>

</body>
</html>
