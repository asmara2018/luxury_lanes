<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Luxury Lanes</title>
    <link rel="stylesheet" href="CSS Luxury Lanes.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="nav.js"></script>
</head>
<body>

<aside class="nav-panel">
    <h2>Luxury Lanes</h2>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-bottom">
        <a href="Login.html" onclick="logout()">Log Out</a>
    </div>
</aside>

<main class="content-area">

    <div class="page-header">
        <h1>Performance Analytics</h1>
    </div>

    <!-- KPI summary tiles -->
    <section class="request-summary">
        <div class="summary-tile">
            <p>Total Requests</p>
            <h2 id="kpiTotal">-</h2>
        </div>
        <div class="summary-tile tile-urgent">
            <p>High Priority</p>
            <h2 id="kpiHigh">-</h2>
        </div>
        <div class="summary-tile tile-active">
            <p>In Progress</p>
            <h2 id="kpiInProg">-</h2>
        </div>
        <div class="summary-tile tile-resolved">
            <p>Completed</p>
            <h2 id="kpiCompleted">-</h2>
        </div>
    </section>

    <!-- Metrics table -->
    <div class="fault-log">
        <h3>Key Metrics</h3>
        <table>
            <thead>
                <tr>
                    <th>Metric</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody id="analyticsTable"></tbody>
        </table>
    </div>

    <!-- Status pie chart -->
    <div class="fault-log">
        <h3>Request Status Overview</h3>
        <div style="width:300px; height:250px;">
            <canvas id="statusChart"></canvas>
        </div>
    </div>

    <!-- Priority bar chart -->
    <div class="fault-log">
        <h3>Priority Breakdown</h3>
        <div style="width:350px; height:270px;">
            <canvas id="priorityChart"></canvas>
        </div>
    </div>

    <!-- Top rooms -->
    <div class="fault-log">
        <h3>Top Rooms by Issue Count</h3>
        <table>
            <thead>
                <tr>
                    <th>Room</th>
                    <th>Issue Count</th>
                </tr>
            </thead>
            <tbody id="topRoomsTable"></tbody>
        </table>
    </div>

    <!-- Staff performance -->
    <div class="fault-log">
        <h3>Staff Performance</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Total Assigned</th>
                    <th>Completed</th>
                    <th>Active</th>
                </tr>
            </thead>
            <tbody id="staffTable"></tbody>
        </table>
    </div>

</main>

<script>
var serverAddress = 'http://127.0.0.1:5000';
var currentUserId = localStorage.getItem('user_id');
var currentRole   = localStorage.getItem('role');

var statusChartInstance = null;
var priorityChartInstance = null;

if (!currentUserId) {
    window.location.href = 'Login.html';
}

if (currentRole !== 'Manager') {
    alert('Access denied. This page is for managers only.');
    window.location.href = 'Dashboard.html';
}

function buildNav() {
    buildNavFromJS('Analytics.html');
}
buildNav();

function logout() {
    fetch(serverAddress + '/logout', { method: 'POST', credentials: 'include' });
    localStorage.removeItem('user_id');
    localStorage.removeItem('role');
    localStorage.removeItem('name');
}

function loadAnalytics() {
    fetch(serverAddress + '/analytics', { credentials: 'include' })
    .then(function(response) { return response.json(); })
    .then(function(data) {

        var reported  = data.reported || 0;
        var inProg    = data.in_progress || 0;
        var completed = data.completed || 0;
        var total     = reported + inProg + completed;

        document.getElementById('kpiTotal').textContent     = total;
        document.getElementById('kpiHigh').textContent      = data.high || 0;
        document.getElementById('kpiInProg').textContent    = inProg;
        document.getElementById('kpiCompleted').textContent = completed;

        var perfIndex = '-';
        if (total > 0) {
            var completionRate = completed / total;
            var ratingNorm     = (data.avg_rating || 0) / 5;
            perfIndex = Math.round((completionRate * 0.6 + ratingNorm * 0.4) * 100) + '%';
        }

        var tbody = document.getElementById('analyticsTable');
        tbody.innerHTML = '';

        var rows = [
            ['Average Completion Time', data.average_time ? data.average_time + ' hrs' : '-'],
            ['Median Completion Time', data.median_time ? data.median_time + ' hrs' : '-'],
            ['On-Time Rate (within 48 hrs)', data.on_time_rate ? data.on_time_rate + '%' : '-'],
            ['SLA Breach Count', data.sla_breaches != null ? data.sla_breaches : '-'],
            ['Escalation Rate', data.escalation_rate ? data.escalation_rate + '%' : '-'],
            ['Average Guest Rating', data.avg_rating ? data.avg_rating + ' / 5' : '-'],
            ['Performance Index', perfIndex]
        ];

        for (var i = 0; i < rows.length; i++) {
            var tr = document.createElement('tr');
            tr.innerHTML = '<td>' + rows[i][0] + '</td><td>' + rows[i][1] + '</td>';
            tbody.appendChild(tr);
        }

        if (statusChartInstance) statusChartInstance.destroy();
        if (priorityChartInstance) priorityChartInstance.destroy();

        var statusCtx = document.getElementById('statusChart').getContext('2d');
        statusChartInstance = new Chart(statusCtx, {
            type: 'pie',
            data: {
                labels: ['Reported', 'In Progress', 'Completed'],
                datasets: [{
                    data: [reported, inProg, completed],
                    backgroundColor: ['#6366f2', '#f59e0b', '#16a34a']
                }]
            },
            options: {
                plugins: { legend: { position: 'bottom' } }
            }
        });

        var priorityCtx = document.getElementById('priorityChart').getContext('2d');
        priorityChartInstance = new Chart(priorityCtx, {
            type: 'bar',
            data: {
                labels: ['High', 'Medium', 'Low'],
                datasets: [{
                    data: [data.high || 0, data.medium || 0, data.low || 0],
                    backgroundColor: ['#ef4444', '#f59e0b', '#16a34a']
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });

        var roomsBody = document.getElementById('topRoomsTable');
        roomsBody.innerHTML = '';

        if (data.top_rooms && data.top_rooms.length > 0) {
            for (var i = 0; i < data.top_rooms.length; i++) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>Room ' + data.top_rooms[i].room_number + '</td><td>' + data.top_rooms[i].issue_count + '</td>';
                roomsBody.appendChild(tr);
            }
        } else {
            roomsBody.innerHTML = '<tr><td colspan="2">No data yet</td></tr>';
        }

        var staffBody = document.getElementById('staffTable');
        staffBody.innerHTML = '';

        if (data.staff_performance && data.staff_performance.length > 0) {
            for (var i = 0; i < data.staff_performance.length; i++) {
                var s = data.staff_performance[i];
                var tr = document.createElement('tr');
                tr.innerHTML =
                    '<td>' + s.name + '</td>' +
                    '<td>' + s.role + '</td>' +
                    '<td>' + (s.total || 0) + '</td>' +
                    '<td>' + (s.done || 0) + '</td>' +
                    '<td>' + (s.active || 0) + '</td>';
                staffBody.appendChild(tr);
            }
        } else {
            staffBody.innerHTML = '<tr><td colspan="5">No staff assigned</td></tr>';
        }

    })
    .catch(function() {
        alert('Analytics could not load. Check that Server.py is running.');
    });
}

document.addEventListener('DOMContentLoaded', loadAnalytics);
</script>

</body>
</html>
